<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Corporación ARC S.A.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0A1628 0%, #1B3A6B 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(10px);
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      color: #fff;
      letter-spacing: 0.12em;
      text-align: center;
      margin-bottom: 8px;
    }
    .logo span { color: #00D4FF; }
    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }
    input {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 8px;
      padding: 14px 16px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
      width: 100%;
    }
    input:focus {
      border-color: #00D4FF;
      background: rgba(0,212,255,0.06);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
    }
    input::placeholder { color: rgba(255,255,255,0.2); }
    .btn {
      width: 100%;
      background: #00D4FF;
      color: #0A1628;
      border: none;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
      letter-spacing: 0.05em;
    }
    .btn:hover { background: #45e3ff; transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .error {
      background: rgba(255,80,80,0.1);
      border: 1px solid #ff5050;
      color: #ff5050;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 16px;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ARC<span>.</span></div>
    <p class="subtitle">Panel de Administración</p>

    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
    </div>

    <button class="btn" onclick="login()">Ingresar</button>
    <div class="error" id="errorMsg">Usuario o contraseña incorrectos</div>
  </div>

  <script>
    // ── CREDENCIALES — CAMBIA ESTOS VALORES DIRECTAMENTE AQUÍ ──
    const ADMIN_USER = 'EmpARCSA@25021992.1';
    const ADMIN_PASS = 'ARCSA@300520.26';
    // ────────────────────────────────────────────────────────────

    // Verificar si ya hay sesion activa
    if (sessionStorage.getItem('arc_admin') === 'true') {
      window.location.href = 'dashboard.html';
    }

    function login() {
      const user = document.getElementById('usuario').value.trim();
      const pass = document.getElementById('password').value.trim();
      const err  = document.getElementById('errorMsg');

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        sessionStorage.setItem('arc_admin', 'true');
        window.location.href = 'dashboard.html';
      } else {
        err.classList.add('show');
        document.getElementById('password').value = '';
        setTimeout(() => err.classList.remove('show'), 3000);
      }
    }

    // Login con Enter
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
