<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Corporación ARC S.A.</title>
  <link rel="icon" href="../assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0A1628;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 16px;
      padding: 56px 48px;
      width: 100%;
      max-width: 440px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo img {
      height: 72px;
      width: auto;
      object-fit: contain;
    }

    .login-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.08em;
      color: #ffffff;
      text-align: center;
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      text-align: center;
      margin-bottom: 40px;
      letter-spacing: 0.05em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 8px;
      padding: 14px 16px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .form-group input:focus {
      border-color: #00D4FF;
      box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
    }

    .form-group input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .btn-login {
      width: 100%;
      background: #00D4FF;
      color: #0A1628;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      margin-top: 8px;
      letter-spacing: 0.03em;
    }

    .btn-login:hover {
      background: #45e3ff;
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .error-msg {
      background: rgba(255,80,80,0.1);
      border: 1px solid rgba(255,80,80,0.4);
      color: #ff8080;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 16px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.2);
    }

    @media (max-width: 480px) {
      .login-card { padding: 40px 24px; }
    }
  </style>
</head>
<body>

  <div class="login-card">

    <div class="login-logo">
      <img src="../assets/images/logo-arc.png" alt="Corporación ARC S.A.">
    </div>

    <h1 class="login-title">Panel Administrativo</h1>
    <p class="login-subtitle">Corporación ARC S.A. — Acceso Restringido</p>

    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
    </div>

    <button class="btn-login" onclick="doLogin()">Ingresar al Panel</button>

    <div class="error-msg" id="errorMsg">
      Usuario o contraseña incorrectos. Intenta de nuevo.
    </div>

    <div class="login-footer">
      © 2026 Corporación ARC S.A. — Uso interno exclusivo
    </div>

  </div>

  <script>
    // Verificar si ya está logueado
    if (sessionStorage.getItem('arc_admin') === 'true') {
      window.location.href = 'dashboard.html';
    }

    // Enter para hacer login
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    function doLogin() {
      const usuario  = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (
        usuario  === 'EmpARCSA@25021992.1' &&
        password === 'ARCSA@300520.26'
      ) {
        sessionStorage.setItem('arc_admin', 'true');
        window.location.href = 'dashboard.html';
      } else {
        errorMsg.classList.add('show');
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }
  </script>

</body>
</html>
