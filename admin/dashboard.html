<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard — Corporación ARC S.A.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #0A1628;
      --secondary: #1B3A6B;
      --accent: #00D4FF;
      --bg: #F8F9FA;
      --white: #FFFFFF;
      --text: #333333;
      --text-light: #888888;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --radius: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* NAVBAR */
    .navbar {
      background: var(--primary);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }
    .navbar__logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: #fff;
      letter-spacing: 0.12em;
    }
    .navbar__logo span { color: var(--accent); }
    .navbar__right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .navbar__badge {
      background: var(--accent);
      color: var(--primary);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.08em;
    }
    .btn-logout {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-logout:hover {
      background: rgba(255,80,80,0.2);
      border-color: #ff5050;
      color: #ff5050;
    }

    /* LAYOUT */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--accent);
      transition: transform 0.3s;
    }
    .stat-card:hover { transform: translateY(-3px); }
    .stat-card.auto { border-left-color: #00C851; }
    .stat-card.print { border-left-color: #C851FF; }
    .stat-card.logistics { border-left-color: #FFA500; }
    .stat-card.talent { border-left-color: #00D4FF; }
    .stat-card.general { border-left-color: #1B3A6B; }
    .stat-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 0.8rem;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* CONTROLES */
    .controls {
      background: var(--white);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .controls__title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      color: var(--primary);
      letter-spacing: 0.05em;
      margin-right: auto;
    }
    select, .search-input {
      background: var(--bg);
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s;
    }
    select:focus, .search-input:focus {
      border-color: var(--accent);
    }
    .search-input { min-width: 240px; }
    .btn-refresh {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-refresh:hover { background: var(--secondary); }
    .btn-notif {
      background: var(--accent);
      color: var(--primary);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-notif:hover { background: #45e3ff; }
    .btn-notif.active {
      background: #00C851;
      color: #fff;
    }

    /* TABLA */
    .table-wrap {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    thead {
      background: var(--primary);
      color: #fff;
    }
    thead th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }
    tbody tr:hover { background: #f8fbff; }
    tbody tr:last-child { border-bottom: none; }
    td {
      padding: 14px 16px;
      color: var(--text);
      vertical-align: middle;
    }
    .division-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .badge-automotriz { background: rgba(0,200,81,0.12); color: #00C851; }
    .badge-print { background: rgba(200,81,255,0.12); color: #C851FF; }
    .badge-logistics { background: rgba(255,165,0,0.12); color: #FFA500; }
    .badge-talent { background: rgba(0,212,255,0.12); color: #0099bb; }
    .badge-general { background: rgba(27,58,107,0.12); color: #1B3A6B; }

    /* LOADING / EMPTY */
    .loading {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-light);
    }
    .loading__spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-light);
      font-size: 0.9rem;
    }

    /* NOTIF TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 0.9rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: 999;
      max-width: 360px;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    .toast__title {
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    /* FOOTER */
    .dash-footer {
      text-align: center;
      padding: 24px;
      color: var(--text-light);
      font-size: 0.8rem;
    }

    @media (max-width: 768px) {
      .navbar { padding: 0 16px; }
      .container { padding: 20px 16px; }
      .controls { flex-direction: column; align-items: stretch; }
      .controls__title { margin-right: 0; }
      .search-input { min-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar__logo">ARC<span>.</span></div>
    <div class="navbar__right">
      <span class="navbar__badge">ADMIN</span>
      <button class="btn-notif" id="btnNotif" onclick="toggleNotificaciones()">
        🔔 Activar alertas
      </button>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </nav>

  <!-- CONTENIDO -->
  <div class="container">

    <!-- STATS -->
    <div class="stats" id="statsGrid">
      <div class="stat-card general">
        <div class="stat-number" id="statTotal">—</div>
        <div class="stat-label">Total leads</div>
      </div>
      <div class="stat-card auto">
        <div class="stat-number" id="statAuto">—</div>
        <div class="stat-label">ARC Automotriz</div>
      </div>
      <div class="stat-card print">
        <div class="stat-number" id="statPrint">—</div>
        <div class="stat-label">ARC Print</div>
      </div>
      <div class="stat-card logistics">
        <div class="stat-number" id="statLogistics">—</div>
        <div class="stat-label">ARC Logistics</div>
      </div>
      <div class="stat-card talent">
        <div class="stat-number" id="statTalent">—</div>
        <div class="stat-label">ARC Talent</div>
      </div>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
      <span class="controls__title">Leads recibidos</span>
      <input type="text" class="search-input" id="searchInput"
        placeholder="Buscar por nombre, correo o división..."
        oninput="filtrarLeads()">
      <select id="filtroDiv" onchange="filtrarLeads()">
        <option value="">Todas las divisiones</option>
        <option value="ARC Automotriz">ARC Automotriz</option>
        <option value="ARC Print">ARC Print</option>
        <option value="ARC Logistics">ARC Logistics</option>
        <option value="ARC Talent">ARC Talent</option>
        <option value="General">General</option>
      </select>
      <button class="btn-refresh" onclick="cargarLeads()">
        ↻ Actualizar
      </button>
    </div>

    <!-- TABLA -->
    <div class="table-wrap">
      <div class="table-container">
        <table id="tablaLeads">
          <thead>
            <tr>
              <th>#</th>
              <th>Fecha</th>
              <th>División</th>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Detalles</th>
              <th>Mensaje</th>
            </tr>
          </thead>
          <tbody id="tbodyLeads">
            <tr>
              <td colspan="8">
                <div class="loading">
                  <div class="loading__spinner"></div>
                  Cargando leads...
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <div class="dash-footer">
    Corporación ARC S.A. — Panel de Administración © 2026
  </div>

  <!-- TOAST NOTIFICACION -->
  <div class="toast" id="toast">
    <div class="toast__title">🔔 Nuevo lead</div>
    <div id="toastMsg">Ha llegado un nuevo lead.</div>
  </div>

  <script>
    // ── CONFIGURACION ─────────────────────────────────────
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhxReE4_b354I8lXVo-hgwCL6lNsdOGAsVeA_oNUDMbRetMMWBHzclovP1txjJssQ8mA/exec';
    const REFRESH_MS = 30000; // Actualizar cada 30 segundos
    // ──────────────────────────────────────────────────────

    let todosLosLeads = [];
    let ultimoConteo = 0;
    let intervalo = null;

    // Verificar sesion
    if (sessionStorage.getItem('arc_admin') !== 'true') {
      window.location.href = 'index.html';
    }

    // Cargar al iniciar
    window.addEventListener('load', () => {
      cargarLeads();
      intervalo = setInterval(verificarNuevosLeads, REFRESH_MS);
    });

    // ── CARGAR LEADS ──────────────────────────────────────
    async function cargarLeads() {
      try {
        const res = await fetch(SCRIPT_URL + '?action=getLeads&t=' + Date.now());
        const data = await res.json();

        if (data.leads) {
          todosLosLeads = data.leads;
          ultimoConteo = todosLosLeads.length;
          renderTabla(todosLosLeads);
          actualizarStats(todosLosLeads);
        }
      } catch(e) {
        document.getElementById('tbodyLeads').innerHTML = `
          <tr><td colspan="8">
            <div class="empty">No se pudieron cargar los leads. Intenta de nuevo.</div>
          </td></tr>`;
      }
    }

    // ── VERIFICAR NUEVOS LEADS ────────────────────────────
    async function verificarNuevosLeads() {
      try {
        const res = await fetch(SCRIPT_URL + '?action=getLeads&t=' + Date.now());
        const data = await res.json();

        if (data.leads && data.leads.length > ultimoConteo) {
          const nuevos = data.leads.length - ultimoConteo;
          const ultimo = data.leads[data.leads.length - 1];

          todosLosLeads = data.leads;
          ultimoConteo = todosLosLeads.length;
          renderTabla(todosLosLeads);
          actualizarStats(todosLosLeads);

          // Mostrar toast
          mostrarToast(`${ultimo[3] || 'Alguien'} — ${ultimo[1] || 'General'}`);

          // Notificacion push si esta activa
          if (Notification.permission === 'granted') {
            new Notification('🔔 Nuevo lead — Corporación ARC S.A.', {
              body: `División: ${ultimo[1] || 'General'}\nNombre: ${ultimo[3] || ''}\nCorreo: ${ultimo[4] || ''}`,
              icon: '/corporacion-arc/assets/images/favicon.png'
            });
          }
        }
      } catch(e) { /* silencioso */ }
    }

    // ── RENDER TABLA ──────────────────────────────────────
    function renderTabla(leads) {
      const tbody = document.getElementById('tbodyLeads');

      if (!leads || leads.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8"><div class="empty">No hay leads aún.</div></td></tr>`;
        return;
      }

      // Mostrar en orden inverso (más reciente primero)
      const reversed = [...leads].reverse();

      tbody.innerHTML = reversed.map((row, i) => {
        const division = row[1] || 'General';
        const badgeClass = getBadgeClass(division);
        const detalles = [row[5], row[6], row[7]].filter(Boolean).join('<br>');

        return `
          <tr>
            <td style="color:#888;font-size:0.8rem">${leads.length - i}</td>
            <td style="white-space:nowrap;font-size:0.8rem;color:#888">${row[0] || ''}</td>
            <td><span class="division-badge ${badgeClass}">${division}</span></td>
            <td style="font-weight:600">${row[2] || ''}</td>
            <td><a href="mailto:${row[3]}" style="color:#1B3A6B;text-decoration:none">${row[3] || ''}</a></td>
            <td>${row[4] || ''}</td>
            <td style="font-size:0.8rem;color:#666">${detalles || '—'}</td>
            <td style="max-width:200px;font-size:0.85rem">${row[8] || ''}</td>
          </tr>`;
      }).join('');
    }

    // ── STATS ─────────────────────────────────────────────
    function actualizarStats(leads) {
      document.getElementById('statTotal').textContent = leads.length;
      document.getElementById('statAuto').textContent =
        leads.filter(r => (r[1]||'').includes('Automotriz')).length;
      document.getElementById('statPrint').textContent =
        leads.filter(r => (r[1]||'').includes('Print')).length;
      document.getElementById('statLogistics').textContent =
        leads.filter(r => (r[1]||'').includes('Logistics')).length;
      document.getElementById('statTalent').textContent =
        leads.filter(r => (r[1]||'').includes('Talent')).length;
    }

    // ── FILTRAR ───────────────────────────────────────────
    function filtrarLeads() {
      const texto = document.getElementById('searchInput').value.toLowerCase();
      const div   = document.getElementById('filtroDiv').value.toLowerCase();

      const filtrados = todosLosLeads.filter(row => {
        const matchDiv  = !div || (row[1]||'').toLowerCase().includes(div);
        const matchText = !texto ||
          (row[2]||'').toLowerCase().includes(texto) ||
          (row[3]||'').toLowerCase().includes(texto) ||
          (row[1]||'').toLowerCase().includes(texto);
        return matchDiv && matchText;
      });

      renderTabla(filtrados);
    }

    // ── BADGE CLASS ───────────────────────────────────────
    function getBadgeClass(div) {
      const d = (div || '').toLowerCase();
      if (d.includes('automotriz')) return 'badge-automotriz';
      if (d.includes('print'))      return 'badge-print';
      if (d.includes('logistics'))  return 'badge-logistics';
      if (d.includes('talent'))     return 'badge-talent';
      return 'badge-general';
    }

    // ── TOAST ─────────────────────────────────────────────
    function mostrarToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 5000);
    }

    // ── NOTIFICACIONES PWA ────────────────────────────────
    function toggleNotificaciones() {
      if (Notification.permission === 'granted') {
        mostrarToast('Las alertas ya están activas ✓');
        document.getElementById('btnNotif').textContent = '✓ Alertas activas';
        document.getElementById('btnNotif').classList.add('active');
        return;
      }

      Notification.requestPermission().then(perm => {
        if (perm === 'granted') {
          document.getElementById('btnNotif').textContent = '✓ Alertas activas';
          document.getElementById('btnNotif').classList.add('active');
          mostrarToast('¡Alertas activadas! Te avisaremos cuando llegue un lead.');
        } else {
          mostrarToast('Permiso denegado. Actívalas desde la configuración del navegador.');
        }
      });
    }

    // Verificar estado de notificaciones al cargar
    if (Notification.permission === 'granted') {
      document.getElementById('btnNotif').textContent = '✓ Alertas activas';
      document.getElementById('btnNotif').classList.add('active');
    }

    // ── LOGOUT ────────────────────────────────────────────
    function logout() {
      sessionStorage.removeItem('arc_admin');
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
