<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensaje enviado — Corporación ARC S.A.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%230A1628'/><text y='72' x='8' font-size='68' font-family='Arial Black' font-weight='900' fill='%2300D4FF'>A</text></svg>">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0A1628;
      color: #F8F9FA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 16px;
      padding: 56px 48px;
      text-align: center;
      max-width: 520px;
      width: 100%;
    }
    .icon { font-size: 4rem; margin-bottom: 24px; }
    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: 0.05em;
      color: #00D4FF;
      margin-bottom: 16px;
    }
    .text {
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.7;
      margin-bottom: 40px;
    }
    .btn {
      display: inline-block;
      background-color: #00D4FF;
      color: #0A1628;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.3s;
    }
    .btn:hover { background-color: #45e3ff; }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.12em;
      margin-bottom: 40px;
      color: rgba(255,255,255,0.4);
    }
    .logo span { color: #00D4FF; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ARC<span>.</span></div>
    <div class="icon">✅</div>
    <h1 class="title">¡Mensaje Enviado!</h1>
    <p class="text">
      Gracias por contactar a Corporación ARC S.A.<br>
      Un asesor se comunicará contigo en menos de 24 horas.
    </p>
    <a href="index.html" class="btn">← Volver al inicio</a>
  </div>
</body>
</html>
